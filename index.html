<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pemindai QR Aset - PT. CBML</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    body {
      background: radial-gradient(circle at top right, #0f172a, #020617);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .input-touch {
      height: 50px;
      font-size: 15px;
    }

    .btn-touch {
      height: 50px;
      font-size: 15px;
      font-weight: 600;
    }

    /* Animasi Laser Overlay Kamera Pemindai */
    .scan-laser {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: #00ffaa;
      box-shadow: 0 0 15px #00ffaa;
      animation: scanMove 2.5s infinite ease-in-out;
      z-index: 10;
    }

    @keyframes scanMove {
      0% { top: 5%; }
      50% { top: 90%; }
      100% { top: 5%; }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-cyan-500 selection:text-white">

  <!-- APP WRAPPER FULL WIDTH -->
  <div class="w-full min-h-screen flex flex-col justify-between max-w-lg mx-auto bg-slate-900/90 border-x border-slate-800/80 shadow-2xl">
    
    <!-- HEADER APLIKASI -->
    <header class="bg-slate-950/90 p-4 border-b border-slate-800 flex items-center justify-between sticky top-0 z-20 backdrop-blur-md">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-blue-600 to-cyan-400 text-white font-bold flex items-center justify-center text-sm shadow-lg shadow-blue-500/20">
          CBML
        </div>
        <div>
          <h1 class="text-sm font-extrabold text-white leading-tight">Pemindai QR Aset</h1>
          <p class="text-[10px] font-medium text-cyan-400">Aplikasi Seluler HC & GA</p>
        </div>
      </div>
      <button id="btn-logout" onclick="handleLogout()" class="hidden text-xs text-red-400 hover:text-red-300 font-semibold px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-800 transition active:scale-95">
        <i class="fa-solid fa-right-from-bracket mr-1"></i> Keluar
      </button>
    </header>

    <!-- CONTAINER UTAMA -->
    <main class="flex-1 p-4 sm:p-6 flex flex-col justify-center">

      <!-- ================= VIEW LOGIN ================= -->
      <div id="view-login" class="space-y-5 my-auto">
        <div class="text-center mb-6">
          <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-tr from-blue-600 to-cyan-400 text-white rounded-2xl mb-3 shadow-lg shadow-blue-500/30">
            <i class="fa-solid fa-qrcode text-3xl"></i>
          </div>
          <h2 class="text-xl font-extrabold text-white">Login Petugas</h2>
          <p class="text-xs text-slate-400 mt-1">Masukkan akun untuk mengakses pemindai aset</p>
        </div>

        <div id="login-alert" class="hidden p-3.5 rounded-2xl bg-red-950/80 border border-red-800/60 text-red-300 text-xs flex items-center gap-2.5 backdrop-blur-sm">
          <i class="fa-solid fa-circle-exclamation text-red-400 text-base shrink-0"></i>
          <span id="login-alert-msg">Username/password salah.</span>
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-4">
          <div>
            <label class="block text-[11px] font-bold text-slate-400 uppercase mb-1.5 tracking-wider">Username</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-500">
                <i class="fa-solid fa-user"></i>
              </span>
              <input type="text" id="login-user" required placeholder="Masukkan username" class="input-touch w-full pl-11 pr-4 bg-slate-950/80 border border-slate-800 rounded-2xl text-sm focus:outline-none focus:border-cyan-500 focus:ring-2 focus:ring-cyan-500/20 text-white transition placeholder-slate-600">
            </div>
          </div>

          <div>
            <label class="block text-[11px] font-bold text-slate-400 uppercase mb-1.5 tracking-wider">Password</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-500">
                <i class="fa-solid fa-lock"></i>
              </span>
              <input type="password" id="login-pass" required placeholder="••••••••" class="input-touch w-full pl-11 pr-4 bg-slate-950/80 border border-slate-800 rounded-2xl text-sm focus:outline-none focus:border-cyan-500 focus:ring-2 focus:ring-cyan-500/20 text-white transition placeholder-slate-600">
            </div>
          </div>

          <button type="submit" id="btn-login" class="btn-touch w-full bg-gradient-to-r from-blue-600 via-blue-500 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 font-bold text-sm rounded-2xl text-white shadow-lg shadow-blue-600/30 transition-all active:scale-[0.98] flex items-center justify-center gap-2 mt-2">
            <span>Masuk Aplikasi</span>
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </form>
      </div>

      <!-- ================= VIEW SCANNER ================= -->
      <div id="view-scanner" class="hidden space-y-4">
        
        <div class="flex items-center justify-between p-3.5 bg-slate-950/80 rounded-2xl border border-slate-800 text-xs">
          <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 flex items-center justify-center">
              <i class="fa-solid fa-user-check"></i>
            </div>
            <span class="text-slate-400">Petugas: <strong id="user-display" class="text-white font-semibold">-</strong></span>
          </div>
        </div>

        <!-- CAMERA FRAME WITH LASER -->
        <div class="space-y-3">
          <div class="relative w-full bg-black rounded-2xl overflow-hidden border-2 border-cyan-500/40 min-h-[240px] shadow-2xl flex items-center justify-center">
            <div class="scan-laser"></div>
            <div id="reader" class="w-full"></div>
          </div>

          <div class="flex gap-2">
            <button onclick="startCamera()" id="btn-start-cam" class="flex-1 py-3 bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white text-xs font-bold rounded-2xl shadow-md transition active:scale-[0.98] flex items-center justify-center gap-2">
              <i class="fa-solid fa-camera"></i> Mulai Kamera
            </button>
            <button onclick="stopCamera()" class="py-3 px-5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold rounded-2xl border border-slate-700 transition active:scale-[0.98]">
              Stop
            </button>
          </div>
        </div>

        <!-- MANUAL CODE ENTRY -->
        <div class="border-t border-slate-800 pt-4">
          <label class="block text-xs font-medium text-slate-400 mb-1.5">Atau Masukkan Kode Aset Manual:</label>
          <div class="flex gap-2">
            <input type="text" id="manual-code" placeholder="Contoh: 225" class="flex-1 px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-2xl text-sm focus:outline-none focus:border-cyan-500 text-white placeholder-slate-600">
            <button onclick="lookupManualCode()" class="px-5 py-2.5 bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-bold rounded-2xl transition active:scale-[0.98]">
              Cari
            </button>
          </div>
        </div>

        <div id="scan-status" class="hidden p-3.5 rounded-2xl text-xs text-center border font-medium"></div>

        <!-- ASSET DETAIL & FORM INSPECTION -->
        <div id="asset-card" class="hidden bg-slate-950 border border-slate-800 p-4.5 rounded-2xl space-y-4 shadow-xl">
          <div class="flex justify-between items-start">
            <div>
              <span class="text-[10px] uppercase font-bold text-cyan-400 tracking-wider">Detail Aset Terverifikasi</span>
              <h3 id="asset-title" class="text-base font-bold text-white mt-0.5">-</h3>
              <p id="asset-sub" class="text-xs text-slate-400">-</p>
            </div>
            <span id="asset-cond" class="px-3 py-1 rounded-full text-[10px] font-bold bg-slate-900 text-emerald-400 border border-slate-800">-</span>
          </div>

          <div class="grid grid-cols-2 gap-2.5 text-xs border-t border-slate-900 pt-3">
            <div class="bg-slate-900/80 p-2.5 rounded-xl border border-slate-800/80">
              <p class="text-[10px] text-slate-500 font-bold uppercase">PIC Terdaftar</p>
              <p id="asset-pic" class="font-semibold text-slate-200 mt-0.5 break-words">-</p>
            </div>
            <div class="bg-slate-900/80 p-2.5 rounded-xl border border-slate-800/80">
              <p class="text-[10px] text-slate-500 font-bold uppercase">Lokasi Terdaftar</p>
              <p id="asset-loc" class="font-semibold text-slate-200 mt-0.5 break-words">-</p>
            </div>
          </div>

          <form id="form-check" onsubmit="submitPhysicalCheck(event)" class="border-t border-slate-900 pt-3 space-y-3">
            <h4 class="text-xs font-bold text-white uppercase tracking-wider">Hasil Pemeriksaan Fisik</h4>
            
            <div>
              <label class="block text-[11px] font-medium text-slate-400 mb-1">Hasil *</label>
              <select id="chk-result" required class="w-full p-2.5 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white outline-none focus:border-cyan-500">
                <option value="">Pilih Hasil Pemeriksaan</option>
                <option value="Sesuai">Sesuai Data Master</option>
                <option value="PIC Berbeda">PIC Berbeda</option>
                <option value="Lokasi Berbeda">Lokasi Berbeda</option>
                <option value="Kondisi Berubah">Kondisi Berubah</option>
                <option value="Tidak Sesuai">Ada Ketidaksesuaian Lain</option>
                <option value="Tidak Ditemukan">Aset Tidak Ditemukan</option>
              </select>
            </div>

            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-[11px] font-medium text-slate-400 mb-1">PIC Aktual *</label>
                <input type="text" id="chk-pic" required class="w-full p-2.5 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white outline-none focus:border-cyan-500">
              </div>
              <div>
                <label class="block text-[11px] font-medium text-slate-400 mb-1">Lokasi Aktual *</label>
                <input type="text" id="chk-loc" required class="w-full p-2.5 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white outline-none focus:border-cyan-500">
              </div>
            </div>

            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-[11px] font-medium text-slate-400 mb-1">Kondisi Aktual *</label>
                <select id="chk-cond" required class="w-full p-2.5 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white outline-none focus:border-cyan-500">
                  <option value="Baik">Baik</option>
                  <option value="Rusak Ringan">Rusak Ringan</option>
                  <option value="Rusak Berat">Rusak Berat</option>
                  <option value="Dalam Perbaikan">Dalam Perbaikan</option>
                  <option value="Tidak Ditemukan">Tidak Ditemukan</option>
                </select>
              </div>
              <div>
                <label class="block text-[11px] font-medium text-slate-400 mb-1">Tanggal *</label>
                <input type="date" id="chk-date" required class="w-full p-2.5 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white outline-none focus:border-cyan-500">
              </div>
            </div>

            <div>
              <label class="block text-[11px] font-medium text-slate-400 mb-1">Catatan Tambahan</label>
              <textarea id="chk-notes" rows="2" placeholder="Catatan fisik..." class="w-full p-2.5 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white outline-none focus:border-cyan-500"></textarea>
            </div>

            <button type="submit" id="btn-save-check" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-2xl transition shadow-lg active:scale-[0.98]">
              Simpan Hasil Pemeriksaan
            </button>
          </form>
        </div>

      </div>
    </main>

    <!-- FOOTER INFO -->
    <footer class="p-3 text-center text-[11px] text-slate-500 border-t border-slate-800/80 bg-slate-950/50">
      PT. Chandra Batuah Mustika Lestari &copy; 2026
    </footer>
  </div>

  <script>
    const BACKEND_URL = "https://script.google.com/macros/s/AKfycbwwkbYas5L_NWO82w54o5r-4xMFwtqHadyjT6LtHKl5K1dYoxsLSSKjJtDgZOhFkRKx9g/exec";

    let sessionToken = localStorage.getItem("cbml_token") || null;
    let currentUser = JSON.parse(localStorage.getItem("cbml_user") || "null");
    let html5QrCode = null;
    let currentAsset = null;

   window.onload = function() {
  // Cek apakah dibuka dari aplikasi utama (ada parameter embedded=true)
  const urlParams = new URLSearchParams(window.location.search);
  const isEmbedded = urlParams.get('embedded') === 'true';

  if (isEmbedded) {
    // Bypass login jika dibuka lewat aplikasi utama HC & GA
    currentUser = { nama: "Petugas Apps Script" };
    showScannerView();
    setTimeout(() => { startCamera(); }, 500); // Otomatis nyalakan kamera
  } else if (sessionToken && currentUser) {
    showScannerView();
  } else {
    showLoginView();
  }
};

    function apiPost(action, data, callback) {
      const payload = { action: action, ...data };
      const callbackName = 'cb_' + Math.random().toString(36).substring(2, 10);
      
      window[callbackName] = function(response) {
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
        callback(response);
      };

      const script = document.createElement('script');
      const encodedData = encodeURIComponent(JSON.stringify(payload));
      script.src = `${BACKEND_URL}?callback=${callbackName}&data=${encodedData}`;
      script.onerror = function() {
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
        callback({ success: false, message: "Koneksi gagal: Server tidak merespon." });
      };
      document.body.appendChild(script);
    }

    function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById("login-user").value;
      const p = document.getElementById("login-pass").value;
      const btn = document.getElementById("btn-login");
      const alertBox = document.getElementById("login-alert");

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> Memeriksa...';
      alertBox.classList.add("hidden");

      apiPost("LOGIN", { username: u, password: p }, function(res) {
        btn.disabled = false;
        btn.innerHTML = '<span>Masuk Aplikasi</span><i class="fa-solid fa-arrow-right"></i>';
        if (res.success) {
          sessionToken = res.token;
          currentUser = res.user;
          localStorage.setItem("cbml_token", sessionToken);
          localStorage.setItem("cbml_user", JSON.stringify(currentUser));
          showScannerView();
        } else {
          document.getElementById("login-alert-msg").innerText = res.message;
          alertBox.classList.remove("hidden");
        }
      });
    }

    function showLoginView() {
      document.getElementById("view-login").classList.remove("hidden");
      document.getElementById("view-scanner").classList.add("hidden");
      document.getElementById("btn-logout").classList.add("hidden");
    }

    function showScannerView() {
      document.getElementById("view-login").classList.add("hidden");
      document.getElementById("view-scanner").classList.remove("hidden");
      document.getElementById("btn-logout").classList.remove("hidden");
      document.getElementById("user-display").innerText = currentUser.nama;
      document.getElementById("chk-date").value = new Date().toISOString().slice(0, 10);
    }

   function handleLogout() {
  stopCamera();
  
  // Cek apakah halaman dibuka dari aplikasi utama HC & GA
  const urlParams = new URLSearchParams(window.location.search);
  const isEmbedded = urlParams.get('embedded') === 'true';

  if (isEmbedded) {
    // 1. Coba tutup tab
    window.close();

    // 2. Jika browser memblokir window.close(), kirim pesan ke aplikasi utama atau redirect/tampilkan instruksi
    setTimeout(function() {
      if (!window.closed) {
        if (window.opener) {
          // Jika ada jendela pembuka, fokuskan kembali ke jendela utama lalu coba tutup lagi
          window.opener.focus();
          window.close();
        } else {
          // Jika dibuka di tab terpisah tanpa window.opener, tampilkan pesan agar pengguna menutup tab
          document.body.innerHTML = `
            <div style="background:#0f172a; color:#fff; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-center; justify-content:center; padding:20px; text-align:center; font-family:sans-serif;">
              <div style="background:#1e293b; padding:30px; rounded:20px; border:1px solid #334155; max-width:400px; border-radius:16px;">
                <h3 style="margin-bottom:10px; color:#38bdf8;">Pemeriksaan Selesai</h3>
                <p style="color:#94a3b8; font-size:14px; margin-bottom:20px;">Silakan tutup tab browser ini untuk kembali ke Aplikasi Utama HC & GA.</p>
                <button onclick="window.close()" style="background:#0284c7; color:#fff; border:none; padding:10px 20px; border-radius:10px; font-weight:bold; cursor:pointer;">Tutup Tab Ini</button>
              </div>
            </div>
          `;
        }
      }
    }, 300);
  } else {
    // Jika dibuka mandiri dari HP, bersihkan sesi dan kembali ke login
    sessionToken = null;
    currentUser = null;
    localStorage.removeItem("cbml_token");
    localStorage.removeItem("cbml_user");
    showLoginView();
  }
}

    function startCamera() {
  if (!html5QrCode) {
    html5QrCode = new Html5Qrcode("reader");
  }
  
  // Fungsi penyesuai ukuran kotak agar lebar & responsif di layar HP maupun PC
  const qrboxFunction = function(viewfinderWidth, viewfinderHeight) {
    const minEdge = Math.min(viewfinderWidth, viewfinderHeight);
    // Menggunakan 80% dari lebar layar kamera agar kotak jauh lebih besar
    const qrboxSize = Math.floor(minEdge * 0.80);
    return {
      width: qrboxSize,
      height: qrboxSize
    };
  };

  const config = { fps: 15, qrbox: qrboxFunction };
  html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
    .catch(err => {
      showStatus("Gagal membuka kamera: " + err, "error");
    });
}

    function stopCamera() {
      if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().then(() => {
          document.getElementById("reader").innerHTML = "";
        });
      }
    }

    function onScanSuccess(decodedText) {
      stopCamera();
      let code = decodedText.trim();
      try {
        const u = new URL(code);
        const q = u.searchParams.get("asset");
        if (q) code = q.trim();
      } catch (e) {}
      code = code.replace(/^KODE\s*ASET\s*:?\s*/i, "").trim();
      fetchAssetDetail(code);
    }

    function lookupManualCode() {
      const code = document.getElementById("manual-code").value.trim();
      if (!code) {
        showStatus("Masukkan kode aset terlebih dahulu.", "error");
        return;
      }
      fetchAssetDetail(code);
    }

    function fetchAssetDetail(code) {
      showStatus("Memuat data aset #" + code + "...", "info");
      document.getElementById("asset-card").classList.add("hidden");

      apiPost("GET_ASSET", { token: sessionToken, kodeAset: code }, function(res) {
        if (res.success && res.asset) {
          currentAsset = res.asset;
          showStatus("Aset terverifikasi!", "success");
          renderAssetCard(res.asset);
        } else {
          showStatus("Gagal: " + (res.message || "Aset tidak ditemukan"), "error");
        }
      });
    }

    function renderAssetCard(a) {
      document.getElementById("asset-title").innerText = (a["Nama Aset"] || "-") + " (Kode " + a["Kode Aset"] + ")";
      document.getElementById("asset-sub").innerText = [a["Merk"], a["Model"], a["Serial Number"] ? "SN: " + a["Serial Number"] : ""].filter(Boolean).join(" · ");
      document.getElementById("asset-cond").innerText = a["Kondisi"] || "-";
      document.getElementById("asset-pic").innerText = a["PIC Barang"] || "-";
      document.getElementById("asset-loc").innerText = a["Lokasi"] || "-";

      document.getElementById("chk-pic").value = a["PIC Barang"] || "";
      document.getElementById("chk-loc").value = a["Lokasi"] || "";
      document.getElementById("chk-cond").value = a["Kondisi"] || "Baik";
      document.getElementById("chk-result").value = "Sesuai";

      document.getElementById("asset-card").classList.remove("hidden");
    }

    function submitPhysicalCheck(e) {
      e.preventDefault();
      if (!currentAsset) return;

      const btn = document.getElementById("btn-save-check");
      btn.disabled = true;
      btn.innerText = "Menyimpan...";

      const payload = {
        kodeAset: String(currentAsset["Kode Aset"]),
        tanggal: document.getElementById("chk-date").value,
        picAktual: document.getElementById("chk-pic").value.trim(),
        lokasiAktual: document.getElementById("chk-loc").value.trim(),
        kondisiAktual: document.getElementById("chk-cond").value,
        hasilPemeriksaan: document.getElementById("chk-result").value,
        catatan: document.getElementById("chk-notes").value.trim()
      };

      apiPost("SUBMIT_INSPECTION", { token: sessionToken, payload: payload }, function(res) {
        btn.disabled = false;
        btn.innerText = "Simpan Hasil Pemeriksaan";
        if (res.success) {
          showStatus("Pemeriksaan fisik berhasil disimpan!", "success");
        } else {
          showStatus("Gagal menyimpan: " + res.message, "error");
        }
      });
    }

    function showStatus(msg, type) {
      const box = document.getElementById("scan-status");
      box.innerText = msg;
      box.classList.remove("hidden", "bg-blue-950/60", "border-blue-800", "text-blue-300", "bg-emerald-950/60", "border-emerald-800", "text-emerald-300", "bg-red-950/60", "border-red-800", "text-red-300");
      if (type === "success") {
        box.classList.add("bg-emerald-950/60", "border-emerald-800", "text-emerald-300");
      } else if (type === "error") {
        box.classList.add("bg-red-950/60", "border-red-800", "text-red-300");
      } else {
        box.classList.add("bg-blue-950/60", "border-blue-800", "text-blue-300");
      }
    }
  </script>
</body>
</html>
